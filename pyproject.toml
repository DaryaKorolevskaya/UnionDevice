[project]
name = "union-card"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.9.0",
    "fastapi>=0.163.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
